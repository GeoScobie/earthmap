<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="description" content="Near-real-time geostationary satellite views of Earth on a 3D globe. EarthMap — GEO-primary imagery with country discovery pages." />
  <meta name="theme-color" content="#0a1628" />
  <link rel="canonical" href="https://earthmap.live/" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/earthmap-mark-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/earthmap-mark-64.png" />
  <link rel="apple-touch-icon" href="/icons/earthmap-mark-180.png" />
  <title>EarthMap — Live Satellite Globe</title>
  <link rel="preconnect" href="https://sat.disasterdb.com" crossorigin />
  <link rel="preconnect" href="https://geocode.disasterdb.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link href="/css/earthmap.css" rel="stylesheet" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 384 512"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 320 512"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112V400c0 26.5 21.5 48 48 48H80c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H48zm192 0c-26.5 0-48 21.5-48 48V400c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H240z"/></symbol>
  </svg>

  <div id="map" role="application" aria-label="EarthMap live satellite globe"></div>

  <!-- Hidden TOC checkboxes — App goes.js visibilityFromCheckbox (all ON) -->
  <div id="emGoesGates" hidden aria-hidden="true">
    <input type="checkbox" id="lyr-goes-east-demo" checked />
    <input type="checkbox" id="lyr-goes-west-demo" checked />
    <input type="checkbox" id="lyr-goes-meteosat-demo" checked />
    <input type="checkbox" id="lyr-goes-gk2a-demo" checked />
  </div>

  <div class="chrome">
    <div class="search-wrap" id="searchWrap">
      <div class="search-bar" role="search">
        <button type="button" class="logo-btn" id="logoBtn" aria-label="EarthMap — reset globe view">
          <img class="logo-mark" src="/icons/earthmap-mark-64.png" width="64" height="64" alt="" />
          <span class="logo-stack">
            <span class="logo-word">EarthMap</span>
            <!-- Tip / observation time (mirrors App transport tip stamp) -->
            <span class="tip-clock" id="tipClock" aria-live="polite" title="Observation time of mosaic tip for map center">
              <span class="tip-dot" aria-hidden="true"></span>
              <span class="tip-label">LIVE</span>
              <span class="tip-times">
                <span class="tip-local" id="tipObsLocal">—</span>
                <span class="tip-sep" aria-hidden="true">·</span>
                <span class="tip-utc" id="tipObsUtc">—</span>
                <span class="tip-sep" aria-hidden="true">·</span>
                <span class="tip-age" id="tipObsAge">—</span>
              </span>
            </span>
          </span>
        </button>
        <div class="search-divider" aria-hidden="true"></div>
        <label class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M15.5 15.5 L20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="search" id="searchInput" placeholder="Search place or country…" autocomplete="off"
            aria-label="Search place or country" aria-autocomplete="list" aria-controls="searchResults" />
        </label>
      </div>
      <ul id="searchResults" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
  </div>

  <!-- Bottom-right GeoColor time transport (chip ↔ expand) — same DOM ids as App -->
  <div id="goesTimeTransport" class="goes-time-transport minimized" hidden aria-label="GeoColor time — tap to expand">
    <button type="button" id="goesTimeHideBtn" class="goes-time-handle" aria-label="Hide time controls">
      Hide
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg>
    </button>
    <button type="button" id="goesTimeChip" class="goes-time-chip" aria-label="Show GeoColor time controls" title="Show time controls">
      <span class="goes-time-chip-pill" aria-hidden="true">
        <svg class="goes-time-chip-sat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg>
        <b class="goes-time-chip-dot"></b>
        <span id="goesTimeAgeChip" class="goes-time-chip-text">—</span>
      </span>
      <svg class="goes-time-chip-chev" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg>
    </button>
    <div class="goes-time-transport-expanded">
      <button type="button" id="goesTimePlayBtn" class="goes-time-play" aria-label="Play GeoColor loop" title="Play last ~4h GeoColor (loops)" aria-pressed="false">
        <svg class="goes-time-play-icon goes-time-play-icon--play" aria-hidden="true"><use href="#i-play"/></svg>
        <svg class="goes-time-play-icon goes-time-play-icon--pause" aria-hidden="true" hidden><use href="#i-pause"/></svg>
        <span class="goes-time-play-icon goes-time-play-icon--spin" aria-hidden="true" hidden></span>
      </button>
      <div class="goes-time-transport-body">
        <div class="goes-time-transport-head">
          <div class="goes-time-when" aria-live="polite">
            <span id="goesTimeLocal" class="goes-time-local">—</span>
            <span id="goesTimeUtc" class="goes-time-utc">—</span>
          </div>
          <span id="goesTimeAge" class="goes-time-age" title="Age of current mosaic frame">—</span>
          <span id="goesTimeScrubLabel" class="goes-time-transport-clock" hidden aria-hidden="true">—</span>
          <button type="button" id="goesTimeLatestBtn" class="goes-time-latest" hidden>Latest</button>
        </div>
        <input type="range" id="goesTimeScrubRange" class="goes-time-scrub-range"
          min="0" max="0" value="0" step="1"
          aria-label="Scrub GeoColor time within play window">
        <div class="goes-time-transport-meta">
          <span id="goesTimeTransportMeta">Last ~4h</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Legacy 1h range scrubber (App keeps hidden; goes.js looks it up) -->
  <div id="geocolorTimeBar" class="geocolor-time-bar" aria-label="GeoColor time" hidden>
    <div class="geocolor-time-head">
      <span id="geocolorTimeLabel" class="geocolor-time-iso">—</span>
      <button type="button" id="geocolorTimeNowBtn" class="geocolor-time-now" hidden>Latest</button>
    </div>
    <input type="range" id="geocolorTimeSlider" class="geocolor-time-slider"
      min="0" max="0" value="0" step="1" aria-label="GeoColor time slider">
  </div>

  <nav class="nav-dock" aria-label="Site">
    <a data-em-path="countries/">Countries</a>
    <a data-em-path="countries/united-states/">United States</a>
    <a data-em-path="countries/united-kingdom/">United Kingdom</a>
    <a data-em-path="countries/japan/">Japan</a>
    <span class="nav-hint">Deep-link: ?lng=&amp;lat=&amp;zoom= · ?scrub=1</span>
  </nav>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

name: Deploy production (FTP — superseded)

# Hostinger FTP blocked / not wired. Prefer GitHub Pages (pages.yml).
# Kept for optional future earthmap.live cutover once Hostinger is ready.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install + build (root base for custom domain)
        env:
          VITE_BASE: /
        run: npm ci && npm run build

      - name: Deploy to earthmap.live (FTP)
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Missing PROD_FTP_* secrets — use GitHub Pages (pages.yml) instead"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" <<'LFTP'
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set cmd:fail-exit yes
          mirror -R --verbose --ignore-time dist/ .
          bye
          LFTP
          echo "Deployed EarthMap @${GITHUB_SHA::7} -> earthmap.live"
